name: Telegram Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env
        run: |
          mkdir -p data
          cat > .env << EOF
          BOT_TOKEN=${{ secrets.BOT_TOKEN }}
          ADMIN_CHAT_ID=${{ secrets.ADMIN_CHAT_ID }}
          DATABASE_PATH=data/bot.db
          EOF

      - name: DEBUG - check source code
        run: |
          echo "================================"
          echo "COMMIT:"
          git rev-parse HEAD
          echo "================================"
          echo "BRANCH:"
          git branch --show-current
          echo "================================"
          echo "CALLBACK REFERENCES:"
          grep -n "Callback" bot/handlers/application.py || true
          echo "================================"
          echo "LINES 100-120:"
          sed -n '100,120p' bot/handlers/application.py
          echo "================================"
          echo "FILE:"
          cat bot/handlers/application.py
          echo "================================"

      - name: Run bot
        run: python main.py
